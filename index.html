let L=localStorage.getItem("cl")||"en";
const $=i=>document.getElementById(i),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),tr=k=>T[L][k]??T.en[k]??k;
let S={...DEF},PW="",D={},TRS=null,NS=[];
function ld(){let d;try{d=JSON.parse(localStorage.getItem("cgprc"))}catch(e){}return d||{b:[],n:[],s:{}}}
function run(a,p){
 if(CFG.API)return fetch(CFG.API,{method:"POST",body:JSON.stringify({a,p})}).then(r=>r.json());
 const d=ld(),sv=()=>localStorage.setItem("cgprc",JSON.stringify(d)),adm=()=>{if(p.pw!==CFG.ADMIN_PASS)throw"Wrong password"};
 if(a=="pub")return{n:d.n,s:d.s};
 if(a=="slots")return d.b.filter(x=>x.date==p.date&&x.st!="Rejected").map(x=>x.slot);
 if(a=="add"){if(d.b.some(x=>x.utr==p.utr))throw"This transaction number is already used";
  if(d.b.some(x=>x.date==p.date&&x.slot==p.slot&&x.st!="Rejected"))throw"This slot was just taken, choose another";
  const id="CG"+Date.now().toString(36).toUpperCase().slice(-6);d.b.push({...p,id,st:"Pending Verification",ts:new Date().toISOString()});sv();return{id}}
 if(a=="track"){const q=String(p.q).trim().toUpperCase();return d.b.filter(x=>x.id==q||x.mobile==q)}
 if(a=="login"){adm();return{ok:1}}
 if(a=="list"){adm();return d.b}
 if(a=="status"){adm();d.b.find(x=>x.id==p.id).st=p.st;sv();return{ok:1}}
 if(a=="nadd"){adm();d.n.unshift({id:Date.now(),text:p.text});sv();return{ok:1}}
 if(a=="ndel"){adm();d.n=d.n.filter(x=>x.id!=p.id);sv();return{ok:1}}
 if(a=="sset"){adm();d.s=p.s;sv();return{ok:1}}
}
async function api(a,p={}){try{const r=await run(a,p);return r&&r.err?{err:r.err}:{d:r}}catch(e){return{err:String(e)}}}
// language
function ap(){document.documentElement.lang=L;
 document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=tr(e.dataset.t));
 document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=tr(e.dataset.p));
 $("l_en").classList.toggle("on",L=="en");$("l_hi").classList.toggle("on",L=="hi");
 rc();rn();drawTrack();slots();if($("p2").classList.contains("hide")==false)$("cp").textContent=tr("p_copy")}
function setL(l){L=l;localStorage.setItem("cl",l);ap()}
$("l_en").onclick=()=>setL("en");$("l_hi").onclick=()=>setL("hi");
function rc(){$("tem").innerHTML=S.email?`<a href="mailto:${E(S.email)}">${E(S.email)}</a>`:"info@yourclinic.com";
 $("tph").innerHTML=S.phone?`<a href="tel:${E(S.phone)}">${E(S.phone)}</a>`:"+918340336728";
 $("ct").innerHTML=`<div class="card"><div class="ic">📍</div><h3>${tr("c_addr")}</h3>${E(S.addr)}<br><a href="https://share.google/FhSbWJvCflEdjmIHJ" target="_blank" rel="noopener">${tr("c_map")}</a></div>
 <div class="card"><div class="ic">🕘</div><h3>${tr("c_time")}</h3>${E(S.hours)}</div>
 <div class="card"><div class="ic">📞</div><h3>${tr("c_reach")}</h3>${S.phone?`${tr("c_call")} <a href="tel:${E(S.phone)}">${E(S.phone)}</a><br>`:""}${S.wa?`<a href="https://wa.me/${E(S.wa)}" target="_blank" rel="noopener">${tr("c_wa")}</a><br>`:""}${S.email?`<a href="mailto:${E(S.email)}">${E(S.email)}</a>`:""}${!S.phone&&!S.wa&&!S.email?tr("c_soon"):""}</div>`}
function rn(){$("nl").innerHTML=NS.length?NS.map(n=>`<div class="ni">${E(n.text)}</div>`).join(""):`<p class="sub">${tr("u_none")}</p>`}
async function load(){const r=await api("pub");if(r.d){S={...DEF,...r.d.s};NS=r.d.n||[]}rc();rn()}
$("yr").textContent=new Date().getFullYear();
$("mb").onclick=()=>$("nv").classList.toggle("on");$("nv").onclick=()=>$("nv").classList.remove("on");
// booking
const today=new Date().toISOString().slice(0,10);$("dt").min=today;$("dt").value=today;
async function slots(){const v=$("sl").value,r=await api("slots",{date:$("dt").value}),t=r.d||[];
 $("sl").innerHTML=SLOTS.map(s=>`<option value="${s}" ${t.includes(s)?"disabled":""}>${s}${t.includes(s)?" "+tr("bk"):""}</option>`).join("");if(v&&!t.includes(v))$("sl").value=v}
$("dt").onchange=slots;
$("f1").onsubmit=e=>{e.preventDefault();
 D={name:$("nm").value.trim(),mobile:$("mo").value.trim(),age:$("ag").value,service:$("sv").value,date:$("dt").value,slot:$("sl").value,concern:$("cn").value.trim()};
 $("sm").textContent=`${$("sv").selectedOptions[0].textContent} · ${D.date} · ${D.slot}`;$("am").textContent="₹"+S.fee;$("ui").textContent=S.upi;
 $("upl").href=`upi://pay?pa=${S.upi}&pn=${encodeURIComponent(S.payee)}&am=${S.fee}&cu=INR&tn=CGPRC%20Appointment`;
 $("f1").classList.add("hide");$("p2").classList.remove("hide");$("p2").scrollIntoView()};
$("bk").onclick=()=>{$("p2").classList.add("hide");$("f1").classList.remove("hide")};
$("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(S.upi);$("cp").textContent=tr("p_copied")};
$("ut").oninput=()=>{const v=$("ut").value=$("ut").value.replace(/\D/g,"");$("sb").disabled=v.length!=12;$("um").textContent=v&&v.length!=12?tr("p_err"):""};
$("sb").onclick=async()=>{
 $("ov").style.display="flex";$("ovb").style.width="0";setTimeout(()=>$("ovb").style.width="100%",50);
 let i=0;const st=()=>$("ovt").textContent=tr(["v1","v2","v3"][i%3]);st();const iv=setInterval(()=>{i++;st()},1800);
 const [r]=await Promise.all([api("add",{...D,utr:$("ut").value}),new Promise(z=>setTimeout(z,5500))]);
 clearInterval(iv);$("ov").style.display="none";
 if(r.err){$("um").textContent=r.err;return}
 $("p2").classList.add("hide");$("ok").classList.remove("hide");
 $("ok").innerHTML=`<div class="card" style="text-align:center"><h3>${tr("ok_t")}</h3><p style="margin:8px 0">${tr("ok_id")} <b style="font-size:22px">${E(r.d.id)}</b></p><span class="tag">${tr("st_Pending Verification")}</span>
 <p style="margin-top:10px">${tr("ok_p")}</p><p style="margin-top:12px"><a class="btn" href="#track" onclick="$('tq').value='${E(r.d.id)}'">${tr("ok_btn")}</a></p></div>`};
// tracker
function drawTrack(){if(!TRS)return;$("tr").innerHTML=TRS.err?`<p class="er">${E(TRS.err)}</p>`:TRS.d.length?TRS.d.map(b=>`<div class="card" style="margin-bottom:10px"><b>${E(b.id)}</b> · ${E(b.name)} <span class="tag ${E(b.st)}">${tr("st_"+b.st)}</span><br>${E(b.service)} · ${E(b.date)} · ${E(b.slot)}${b.st=="Confirmed"?`<p class="ok">${tr("t_cf")}</p>`:b.st=="Rejected"?`<p class="er">${tr("t_rj")}</p>`:`<p>${tr("t_pd")}</p>`}</div>`).join(""):`<p class="er">${tr("t_none")}</p>`}
$("tb").onclick=async()=>{const q=$("tq").value.trim();if(!q)return;TRS=await api("track",{q});drawTrack()};
// admin (English only)
function route(){const a=location.hash=="#admin";$("admin").classList.toggle("hide",!a);document.querySelectorAll("section:not(#admin),.band").forEach(s=>s.classList.toggle("hide",a));if(a)scrollTo(0,0)}
addEventListener("hashchange",route);route();
$("lb").onclick=async()=>{const r=await api("login",{pw:$("ap").value});if(r.err){$("le").textContent=r.err;return}PW=$("ap").value;$("lg").classList.add("hide");$("db").classList.remove("hide");fill();refresh()};
$("lo").onclick=()=>{PW="";$("db").classList.add("hide");$("lg").classList.remove("hide");$("ap").value=""};
let B=[];
async function refresh(){if(!PW)return;const r=await api("list",{pw:PW});if(r.err)return;B=r.d.slice().reverse();draw();
 const n=await api("pub");$("nm2").innerHTML=(n.d.n||[]).map(x=>`<div class="ni">${E(x.text)} <button class="btn s r" onclick="nd('${E(x.id)}')">Delete</button></div>`).join("")}
function draw(){const f=$("fl").value,c=s=>B.filter(b=>b.st==s).length;
 $("st").innerHTML=[["Total",B.length],["Pending",c("Pending Verification")],["Confirmed",c("Confirmed")],["Rejected",c("Rejected")]].map(x=>`<div class="card"><b style="font-size:28px;color:var(--p)">${x[1]}</b><br>${x[0]}</div>`).join("");
 $("tbd").innerHTML=B.filter(b=>!f||b.st==f).map(b=>`<tr><td><b>${E(b.id)}</b></td><td>${E(b.name)}<br>${E(b.mobile)} · ${E(b.age)}y</td><td>${E(b.service)}<br>${E(b.date)}<br>${E(b.slot)}</td><td>${E(b.utr)}</td><td><span class="tag ${E(b.st)}">${E(b.st)}</span></td><td>
 <button class="btn s g" onclick="stt('${E(b.id)}','Confirmed')">Approve</button> <button class="btn s r" onclick="stt('${E(b.id)}','Rejected')">Reject</button> <a class="btn s o" target="_blank" rel="noopener" href="https://wa.me/91${E(b.mobile)}?text=${encodeURIComponent("Hello "+b.name+", your CGPRC booking "+b.id+" is "+b.st+" for "+b.date+", "+b.slot+".")}">WhatsApp</a></td></tr>`).join("")||"<tr><td colspan=6>No bookings</td></tr>"}
async function stt(id,st){await api("status",{pw:PW,id,st});refresh()}
async function nd(id){await api("ndel",{pw:PW,id});refresh();load()}
$("fl").onchange=draw;$("rf").onclick=refresh;setInterval(refresh,20000);
$("na").onclick=async()=>{const t=$("nt").value.trim();if(!t)return;await api("nadd",{pw:PW,text:t});$("nt").value="";refresh();load()};
const SK=["fee","upi","phone","wa","email","hours","addr"];
function fill(){SK.forEach(k=>$("s_"+k).value=S[k]||"")}
$("ss").onclick=async()=>{const s={};SK.forEach(k=>s[k]=$("s_"+k).value.trim());await api("sset",{pw:PW,s});$("sm2").textContent="Saved ✔";load()};
ap();load();
</script></body></html>
